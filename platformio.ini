[platformio]
default_envs = usb
src_dir = .
extra_configs = platformio.local*.ini

[env]
platform = platformio/ststm32@19.7.1
platform_packages =
    platformio/framework-arduinoststm32@4.21200.0
    platformio/framework-cmsis@2.60300.0
    platformio/framework-cmsis-dsp@1.16.2
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/tool-dfuutil@1.11.0
    platformio/tool-stm32duino@1.0.2
board = bluepill_f103c8
framework = arduino
build_src_filter =
    +<A2D_*.cpp>
    +<firmware/main.cpp>
build_flags =
    -I .
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_CDC_USE_SINGLE_BUFFER
    -D A2D_HUB_SAFE_BOOTLOADER_RESET
    -flto
extra_scripts = pre:tools/pio_config.py
custom_device_serial = 0002
board_build.flash_offset = 0x2000
board_upload.offset_address = 0x08002000
monitor_speed = 115200
monitor_eol = LF
; Keep the final two 1 KiB pages for recoverable settings records.
board_upload.maximum_size = 63488

[env:usb]
upload_protocol = custom

[env:stlink]
upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak setup
